<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pellet Heizung Dashboard</title>
    <!-- Fixes the missing favicon warning -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="container">
      <section id="login-section" class="card">
        <h1>Login</h1>
        <p class="hint">Melde dich mit deinem Firebase User-Account an.</p>
        <form id="login-form">
          <label>
            E-Mail
            <input id="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Passwort
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Anmelden</button>
        </form>
        <p id="login-error" class="error" role="alert"></p>
      </section>

      <!-- Wichtig: heating-status-section ID hinzugefügt, damit das Skript es ein-/ausblenden kann -->
      <section id="dashboard-section" class="card hidden">

        <div id="heating-status-section" class="hidden" style="margin-top: 20px;">
          <h2>Heizungs-Status (ETA Live-Daten)</h2>
          <p id="heating-timestamp" class="hint"></p>
          
          <div id="heating-details-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;">
            <div style="background: rgba(0,0,0,0.03); padding: 12px; border-radius: 8px;">
              <strong>An-Zustand:</strong> <span id="val-ist-an">-</span>
            </div>
            <div style="background: rgba(0,0,0,0.03); padding: 12px; border-radius: 8px;">
              <strong>Asche:</strong> <span id="val-asche">-</span>
            </div>
            <div style="background: rgba(0,0,0,0.03); padding: 12px; border-radius: 8px;">
              <strong>Gesamtmenge:</strong> <span id="val-menge">-</span>
            </div>
          </div>

          <!-- NEU: Container für die Fehler-Liste mit msg="" -->
          <div style="margin-top: 15px; background: rgba(239, 68, 68, 0.05); padding: 12px; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.2);">
            <strong style="color: #ef4444;">Aktuelle Meldungen / Fehler:</strong>
            <ul id="heating-errors-list" style="margin: 5px 0 0 20px; padding: 0; color: #1f2933;">
              <li>Keine Fehler geladen.</li>
            </ul>
          </div>
        </div>

        <div class="header-row">
          <h1>Messwerte der letzten 30 Tage</h1>
          <button id="logout-button" type="button" class="secondary">Logout</button>
        </div>
        
        <p id="last-update" class="hint" style="margin-top: 4px; font-weight: 500;"></p>
        <p id="latest-info" class="hint" style="margin-top: 2px; font-weight: 600; color: #d97706;"></p>
        <p id="status" class="hint">Lade Daten…</p>

        <div class="chart-grid" style="margin-top: 25px;">
          <article>
            <h2>Restvolumen (m³)</h2>
            <canvas id="volume-chart"></canvas>
          </article>
          <article>
            <h2>Resthöhe (cm)</h2>
            <canvas id="distance-chart"></canvas>
          </article>
          <article>
            <h2>Temperatur (°C)</h2>
            <canvas id="temperature-chart"></canvas>
          </article>
          <article>
            <h2>Luftfeuchtigkeit (%)</h2>
            <canvas id="humidity-chart"></canvas>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
